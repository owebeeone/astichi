[package]
name = "astichi_native_engine"
version = "1.1.1"
edition = "2021"
publish = false

[lib]
name = "_astichi_native_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module", "abi3-py38"] }
rustpython-parser = "0.4.0"
rustpython-ast = { version = "0.4.0", features = ["visitor"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Local Rust profiling: `cargo build --profile profiling` (see scratch profiles).
[profile.profiling]
inherits = "release"
lto = true
codegen-units = 1
strip = false
debug = 2
