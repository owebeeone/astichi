[project]
name = "astichi"
branch = "main"
remote = "origin"
tag_prefix = "v"
github_repo = "owebeeone/astichi"

[python]
version = "static"
manifest = "pyproject.toml"
lockfiles = ["uv.lock"]
lock_command = ["uv", "lock", "--python", "3.12"]

[release]
managed_files = ["src/astichi/__init__.py"]
checks = [
    ["uv", "run", "--no-project", "--python", "3.12", "python", "scripts/release_checks.py", "sync-version", "{python_version}"],
    ["uv", "run", "--no-project", "--python", "3.12", "python", "scripts/release_checks.py", "verify-version", "{python_version}"],
    ["uv", "run", "--no-project", "--python", "3.12", "python", "scripts/release_checks.py", "test-matrix", "{python_version}"],
    ["uv", "run", "--no-project", "--python", "3.12", "--with-requirements", "docs-requirements.txt", "mkdocs", "build", "--strict", "--site-dir", "build/release-docs"],
    ["uv", "run", "--no-project", "--python", "3.12", "--with", "build", "--with", "twine", "python", "scripts/release_checks.py", "distributions", "{python_version}"],
]
# Verification after the candidate commit must not rewrite its version mirror.
exact_checks = [
    ["uv", "run", "--no-project", "--python", "3.12", "python", "scripts/release_checks.py", "verify-version", "{python_version}"],
    ["uv", "run", "--no-project", "--python", "3.12", "python", "scripts/release_checks.py", "test-matrix", "{python_version}"],
    ["uv", "run", "--no-project", "--python", "3.12", "--with-requirements", "docs-requirements.txt", "mkdocs", "build", "--strict", "--site-dir", "build/release-docs"],
    ["uv", "run", "--no-project", "--python", "3.12", "--with", "build", "--with", "twine", "python", "scripts/release_checks.py", "distributions", "{python_version}"],
]
github_notes = """
Astichi {tag}.

See the commit history for changes. The release workflow verifies the supported
Python versions and builds native wheels and a source distribution before PyPI
publication.
"""
