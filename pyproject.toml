[build-system]
requires = ["hatchling>=1.24", "wheel>=0.43"]
build-backend = "hatchling.build"

[project]
name = "astichi"
version = "1.0.2"
description = "AST composition helpers: markers, hygiene, lifting, and lowering for composable Python code generation"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "astichi contributors" }]
license = { file = "LICENSE" }
keywords = ["ast", "codegen", "composition", "compiler"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
test = ["pytest>=7.0"]

[tool.uv]
exclude-newer = "1 week"

[tool.hatch.version]
path = "src/astichi/__init__.py"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/astichi",
  "tests",
  "dev-docs",
  "native_probe",
  "native_engine",
  "hatch_build.py",
  "scratch",
  "LICENSE",
  "README.md",
]

[tool.cibuildwheel]
# Release wheels: CPython 3.12–3.14 on common 64-bit platforms.
build = "cp312-* cp313-* cp314-*"
# `build` already limits interpreters; skip musllinux, free-threaded, and 32-bit targets.
skip = ["*-musllinux_*", "cp3??t-*", "*-win32", "*-manylinux_i686"]
# Full pytest suite runs in GHA; smoke-import only inside the wheel repair step.
test-command = "python -c \"import astichi; from astichi.lower_engine.native import load_native_extension; assert load_native_extension(required=False) is not None\""
environment-pass = ["RUSTFLAGS", "PYO3_PYTHON", "ASTICHI_REQUIRE_NATIVE_BUILD"]
# Release builds must ship the native extension; sdist installs may fall back.
environment = { ASTICHI_REQUIRE_NATIVE_BUILD = "1" }

[tool.cibuildwheel.linux]
# Install Rust into fixed paths; do not rely on shell-only PATH from before-all.
before-all = """
set -eux
export CARGO_HOME=/root/.cargo RUSTUP_HOME=/root/.rustup
curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
/root/.cargo/bin/cargo --version
"""
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.linux.environment]
PATH = "/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
CARGO_HOME = "/root/.cargo"
RUSTUP_HOME = "/root/.rustup"
ASTICHI_REQUIRE_NATIVE_BUILD = "1"

[tool.cibuildwheel.macos]
environment = { ASTICHI_REQUIRE_NATIVE_BUILD = "1", RUSTFLAGS = "-C link-arg=-undefined -C link-arg=dynamic_lookup" }

[tool.cibuildwheel.windows]
# PyO3/Rust on GHA is 64-bit; skip 32-bit CPython (win32) wheels.
archs = ["AMD64"]
environment = { ASTICHI_REQUIRE_NATIVE_BUILD = "1" }

# Run: uv run --with pytest pytest -q
# Focused: uv run --with pytest pytest <test-path> -q
[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.astichi.test-matrix]
python = ["3.12", "3.13", "3.14", "3.15"]
lower_engine = ["python", "native"]

# Hatchling uses `src/` layout; Pyright/Basedpyright need the same path so
# `import astichi` resolves when analyzing files under `docs/` (and from the
# monorepo root, see `../pyrightconfig.json`).
[tool.pyright]
extraPaths = ["src"]

[tool.basedpyright]
extraPaths = ["src"]
