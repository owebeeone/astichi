# Publish astichi to PyPI when a GitHub release is published.
# Builds platform wheels (Linux, macOS, Windows) with the native Rust extension,
# plus an sdist that compiles the extension on install when no wheel matches.

name: Publish astichi to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Run pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --with pytest pytest -q

  wheel-smoke:
    name: Wheel build smoke (cp312)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and check wheel
        env:
          ASTICHI_REQUIRE_NATIVE_BUILD: "1"
        run: |
          python -m pip install --upgrade build wheel twine
          python -m build --wheel --outdir dist
          python -m twine check dist/*.whl

      - name: Install wheel and import native extension
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          from importlib.metadata import version

          import astichi
          from astichi.lower_engine.native import load_native_extension

          assert astichi.__version__ == version("astichi")
          assert load_native_extension(required=False) is not None
          PY

  build-wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: one arch per runner (aarch64 manylinux cannot run on x86_64 hosts).
          - os: ubuntu-latest
            cibw_archs_linux: x86_64
          - os: ubuntu-24.04-arm
            cibw_archs_linux: aarch64
          - os: windows-latest
            cibw_archs_linux: ""
          # macos-13 retired 2025-12; use Intel and Apple Silicon runners below.
          - os: macos-15-intel # x86_64 macOS wheels
            cibw_archs_linux: ""
          - os: macos-15 # arm64 macOS wheels
            cibw_archs_linux: ""

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cibuildwheel
        run: python -m pip install --upgrade cibuildwheel

      - name: Build wheels
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs_linux }}
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate package metadata
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          name = data["project"]["name"]
          version = data["project"]["version"]
          if name != "astichi":
              raise SystemExit(f"expected package name 'astichi', got {name!r}")
          print(f"building {name} {version}")
          PY

      - name: Build sdist
        env:
          ASTICHI_REQUIRE_NATIVE_BUILD: "1"
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check dist/*.tar.gz

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: astichi-sdist
          path: dist/*.tar.gz

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - test
      - wheel-smoke
      - build-wheels
      - build-sdist
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/astichi

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: astichi-sdist
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -la dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
