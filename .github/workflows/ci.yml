# Run the versioned test matrix and a release wheel smoke check on main pushes
# and pull requests. PyPI publish remains release-triggered in publish.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.15 is in the local test matrix but not on GHA hosted runners yet.
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Run pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          uv run --with pytest pytest -q

  wheel-smoke:
    name: Wheel build smoke (cp312)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        env:
          ASTICHI_REQUIRE_NATIVE_BUILD: "1"
        run: |
          python -m pip install --upgrade build wheel twine
          python -m build --wheel --outdir dist
          python -m twine check dist/*.whl
          ls -la dist/

      - name: Install wheel and import native extension
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import astichi
          from astichi.lower_engine.native import load_native_extension

          assert astichi.__version__ == "1.0.3"
          assert load_native_extension(required=False) is not None
          print("astichi", astichi.__version__, "native extension OK")
          PY
